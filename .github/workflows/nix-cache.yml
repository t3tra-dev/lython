name: Nix cache

# Populates comamoca-lython.cachix.org with the lython derivation so `nix
# run` users do not pay the lython source build (LLVM/MLIR itself is
# already a binary cache hit via llvmPackages_23).

on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "src/**"
      - "emitter/**"
      - "runtime/**"
      - "tools/**"
      - "CMakeLists.txt"
      - ".github/workflows/nix-cache.yml"
  workflow_dispatch:

jobs:
  cache:
    name: Build & push to Cachix
    runs-on: ubuntu-latest
    # LLVM + MLIR + lython source builds are far over the default timeout.
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v16
        with:
          name: comamoca-lython
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          # Everything already in the local store (e.g. from a developer's
          # `nix build`) is pushed too — that is the point of this job.
          skipPush: false

      - name: Build packages
        env:
          NIX_CONFIG: "max-jobs = 4 cores = 4"
        run: nix build .#lython -L

      - name: Build devShell (warms build-only deps)
        run: nix develop -c true
